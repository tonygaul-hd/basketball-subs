<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Basketball Subs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f23;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 12px;
}
h1 {
  text-align: center;
  font-size: 1.4rem;
  padding: 12px 0 8px;
  color: #ff9f43;
}
.tabs {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 12px;
}
.tab {
  padding: 10px 20px;
  border: 2px solid #333;
  border-radius: 8px;
  background: #1a1a2e;
  color: #aaa;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active {
  background: #ff9f43;
  color: #1a1a2e;
  border-color: #ff9f43;
}
.config {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.config label { font-size: 0.95rem; color: #ccc; }
.config select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #1a1a2e;
  color: #fff;
  font-size: 1rem;
}
.rotate-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 2px solid #ff9f43;
  background: #1a1a2e;
  color: #ff9f43;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.rotate-btn:hover {
  background: #ff9f43;
  color: #1a1a2e;
}
.collapsible {
  margin-bottom: 12px;
}
.collapsible-header {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 8px 12px;
  background: #16213e;
  border-radius: 6px;
  user-select: none;
  max-width: 600px;
  margin: 0 auto 6px;
}
.collapsible-header h2 {
  font-size: 1rem;
  color: #ff9f43;
  margin: 0;
}
.collapsible-arrow {
  color: #ff9f43;
  font-size: 0.8rem;
  transition: transform 0.2s;
}
.collapsible.collapsed .collapsible-arrow {
  transform: rotate(-90deg);
}
.collapsible.collapsed .collapsible-body {
  display: none;
}
.players-grid {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.player-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.player-label {
  width: 28px;
  font-weight: 700;
  color: #ff9f43;
  font-size: 1rem;
  text-align: center;
  flex-shrink: 0;
}
.player-input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #16213e;
  color: #fff;
  font-size: 1rem;
}
.player-input:focus {
  outline: none;
  border-color: #ff9f43;
}
.table-wrap {
  overflow-x: auto;
  margin-bottom: 16px;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  min-width: 500px;
}
th {
  background: #1a1a2e;
  color: #ff9f43;
  padding: 8px 4px;
  position: sticky;
  top: 0;
  font-size: 0.9rem;
  font-weight: 700;
  border-bottom: 2px solid #ff9f43;
}
td {
  padding: 8px 4px;
  text-align: center;
  border-bottom: 1px solid #222;
  font-weight: 600;
  transition: background 0.2s;
  font-size: 0.8rem;
}
td.court {
  background: #1b5e20;
  color: #c8e6c9;
}
td.bench {
  background: #4a1a1a;
  color: #f0f0f0;
  font-style: italic;
}
td.period-info {
  background: #16213e;
  color: #ccc;
  text-align: left;
  padding-left: 8px;
  white-space: nowrap;
  font-weight: 400;
  font-size: 0.8rem;
}
.summary {
  max-width: 600px;
  margin: 0 auto;
}
.summary h2 {
  font-size: 1.1rem;
  color: #ff9f43;
  margin-bottom: 8px;
  text-align: center;
}
.summary-grid {
  display: grid;
  gap: 6px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: 6px;
  background: #16213e;
}
.summary-name { font-weight: 600; }
.summary-mins { color: #a5d6a7; font-weight: 700; }
.summary-bar-wrap {
  flex: 1;
  margin: 0 12px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
}
.summary-bar {
  height: 100%;
  background: #4caf50;
  border-radius: 3px;
  transition: width 0.3s;
}
.total-check {
  text-align: center;
  margin-top: 10px;
  font-size: 0.85rem;
  color: #888;
}
</style>
</head>
<body>

<h1>Basketball Subs</h1>
<div class="tabs" id="tabs"></div>

<div class="config">
  <label for="qlen">Quarter length:</label>
  <select id="qlen">
    <option value="8">8 min</option>
    <option value="10" selected>10 min</option>
    <option value="12">12 min</option>
  </select>
  <button class="rotate-btn" onclick="rotatePlayers()">Rotate</button>
</div>

<div class="collapsible" id="players-section">
  <div class="collapsible-header" onclick="toggleSection('players-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>Players</h2>
  </div>
  <div class="collapsible-body" id="players"></div>
</div>
<div class="table-wrap"><table id="rotation"><thead></thead><tbody></tbody></table></div>
<div class="collapsible" id="summary-section">
  <div class="collapsible-header" onclick="toggleSection('summary-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>Playing Time</h2>
  </div>
  <div class="collapsible-body" id="summary"></div>
</div>

<script>
const LETTERS = ['A','B','C','D','E','F','G','H'];

const BENCH_SCHEDULES = {
  8: [
    [5,6,7], [2,3,4], [0,1,7], [4,5,6], [1,2,3], [0,6,7], [3,4,5], [0,1,2], [5,6,7]
  ],
  7: [
    [5,6], [3,4], [1,2], [0,6], [4,5], [2,3], [0,1], [5,6], [3,4]
  ],
  6: [
    [5], [4], [3], [2], [1], [0], [5], [4], [3]
  ]
};

function getStore() {
  try { return JSON.parse(window.name || '{}'); } catch(e) { return {}; }
}
function saveData(key, val) {
  const store = getStore();
  store[key] = val;
  window.name = JSON.stringify(store);
}
function loadData(key) {
  return getStore()[key] || null;
}
function toggleSection(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

let activeTab = parseInt(loadData('bball_activeTab')) || 8;
let names = JSON.parse(loadData('bball_names') || '{}');

function init() {
  const tabsEl = document.getElementById('tabs');
  [6,7,8].forEach(n => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (n === activeTab ? ' active' : '');
    btn.textContent = n + ' Players';
    btn.onclick = () => switchTab(n);
    tabsEl.appendChild(btn);
  });
  const savedQlen = loadData('bball_qlen');
  if (savedQlen) document.getElementById('qlen').value = savedQlen;
  buildAll();
  document.getElementById('qlen').addEventListener('change', () => {
    saveData('bball_qlen', document.getElementById('qlen').value);
    buildAll();
  });
}

function rotatePlayers() {
  const n = activeTab;
  const letters = LETTERS.slice(0, n);
  const shift = 3;
  const oldNames = letters.map(l => names[l] || ('Player ' + l));
  letters.forEach((l, i) => {
    const fromIdx = (i - shift + n) % n;
    names[l] = oldNames[fromIdx];
  });
  saveData('bball_names', JSON.stringify(names));
  buildAll();
}

function switchTab(n) {
  activeTab = n;
  saveData('bball_activeTab', n);
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', [6,7,8][i] === n);
  });
  buildAll();
}

function buildAll() {
  buildInputs();
  buildTable();
  buildSummary();
}

function buildInputs() {
  const el = document.getElementById('players');
  const letters = LETTERS.slice(0, activeTab);
  el.innerHTML = '<div class="players-grid">' + letters.map(l => {
    const saved = names[l] || ('Player ' + l);
    return `<div class="player-row">
      <span class="player-label">${l}</span>
      <input class="player-input" data-letter="${l}" value="${saved}" oninput="onName(this)">
    </div>`;
  }).join('') + '</div>';
}

function onName(input) {
  names[input.dataset.letter] = input.value;
  saveData('bball_names', JSON.stringify(names));
  buildTable();
  buildSummary();
}

function getName(idx) {
  const l = LETTERS[idx];
  return names[l] || ('Player ' + l);
}

function getPeriods() {
  const q = parseInt(document.getElementById('qlen').value);
  const half = q / 2;
  const third = q / 3;
  return [
    { quarter: 'Q1', from: q, to: half, mins: half },
    { quarter: 'Q1', from: half, to: 0, mins: half },
    { quarter: 'Q2', from: q, to: half, mins: half },
    { quarter: 'Q2', from: half, to: 0, mins: half },
    { quarter: 'Q3', from: q, to: half, mins: half },
    { quarter: 'Q3', from: half, to: 0, mins: half },
    { quarter: 'Q4', from: q, to: q - third, mins: third },
    { quarter: 'Q4', from: q - third, to: q - third * 2, mins: third },
    { quarter: 'Q4', from: q - third * 2, to: 0, mins: third },
  ];
}

function fmtTime(mins) {
  const m = Math.floor(mins);
  const s = Math.round((mins - m) * 60);
  return m + ':' + String(s).padStart(2, '0');
}

function fmtMinsSec(totalMins) {
  const m = Math.floor(totalMins);
  const s = Math.round((totalMins - m) * 60);
  return m + ':' + String(s).padStart(2, '0');
}

function buildTable() {
  const n = activeTab;
  const bench = BENCH_SCHEDULES[n];
  const periods = getPeriods();
  const letters = LETTERS.slice(0, n);

  let headHtml = '<tr><th>Qtr</th><th>Clock</th>';
  letters.forEach(l => {
    headHtml += `<th>${l}</th>`;
  });
  headHtml += '</tr>';

  let bodyHtml = '';
  periods.forEach((p, pi) => {
    const benchSet = new Set(bench[pi]);
    bodyHtml += '<tr>';
    bodyHtml += `<td class="period-info">${p.quarter}</td>`;
    bodyHtml += `<td class="period-info">${fmtTime(p.from)} - ${fmtTime(p.to)}</td>`;
    for (let i = 0; i < n; i++) {
      const onBench = benchSet.has(i);
      const displayName = getName(i);
      bodyHtml += `<td class="${onBench ? 'bench' : 'court'}">${displayName}</td>`;
    }
    bodyHtml += '</tr>';
  });

  const table = document.getElementById('rotation');
  table.querySelector('thead').innerHTML = headHtml;
  table.querySelector('tbody').innerHTML = bodyHtml;
}

function buildSummary() {
  const n = activeTab;
  const bench = BENCH_SCHEDULES[n];
  const periods = getPeriods();
  const q = parseInt(document.getElementById('qlen').value);
  const totalGameMins = q * 4 * 5;

  let playerMins = [];
  let maxMins = 0;
  for (let i = 0; i < n; i++) {
    let total = 0;
    periods.forEach((p, pi) => {
      if (!bench[pi].includes(i)) total += p.mins;
    });
    playerMins.push(total);
    if (total > maxMins) maxMins = total;
  }

  let checkSum = playerMins.reduce((a, b) => a + b, 0);

  let html = '<div class="summary-grid">';
  for (let i = 0; i < n; i++) {
    const pct = maxMins > 0 ? (playerMins[i] / maxMins * 100) : 0;
    const periodsPlayed = periods.length - bench.filter(b => b.includes(i)).length;
    html += `<div class="summary-row">
      <span class="summary-name">${getName(i)}</span>
      <div class="summary-bar-wrap"><div class="summary-bar" style="width:${pct}%"></div></div>
      <span class="summary-mins">${fmtMinsSec(playerMins[i])} (${periodsPlayed} periods)</span>
    </div>`;
  }
  html += '</div>';
  html += `<div class="total-check">Total player-minutes: ${fmtMinsSec(checkSum)} / ${fmtMinsSec(totalGameMins)} game-minutes</div>`;

  document.getElementById('summary').innerHTML = html;
}

init();
</script>

</body>
</html>
