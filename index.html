<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Basketball Subs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f23;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 12px;
}
body.no-scroll {
  overflow: hidden;
  touch-action: none;
}
h1 {
  text-align: center;
  font-size: 1.4rem;
  padding: 12px 0 8px;
  color: #ff9f43;
}
.tabs {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 12px;
}
.tab {
  padding: 10px 20px;
  border: 2px solid #333;
  border-radius: 8px;
  background: #1a1a2e;
  color: #aaa;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active {
  background: #ff9f43;
  color: #1a1a2e;
  border-color: #ff9f43;
}
.config-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}
.config-row label { font-size: 0.95rem; color: #ccc; }
.config-row select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #1a1a2e;
  color: #fff;
  font-size: 1rem;
}
.rotate-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 2px solid #ff9f43;
  background: #1a1a2e;
  color: #ff9f43;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.rotate-btn:hover {
  background: #ff9f43;
  color: #1a1a2e;
}
.start-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 2px solid #e74c3c;
  background: #e74c3c;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.start-btn:hover {
  background: #c0392b;
  border-color: #c0392b;
}
.collapsible {
  margin-bottom: 12px;
}
.collapsible-header {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 8px 12px;
  background: #16213e;
  border-radius: 6px;
  user-select: none;
  max-width: 600px;
  margin: 0 auto 6px;
}
.collapsible-header h2 {
  font-size: 1rem;
  color: #ff9f43;
  margin: 0;
}
.collapsible-arrow {
  color: #ff9f43;
  font-size: 0.8rem;
  transition: transform 0.2s;
}
.collapsible.collapsed .collapsible-arrow {
  transform: rotate(-90deg);
}
.collapsible.collapsed .collapsible-body {
  display: none;
}
.players-grid {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.player-row {
  display: flex;
  align-items: center;
  gap: 8px;
  transition: opacity 0.2s;
  position: relative;
}
.player-row.dragging {
  opacity: 0.4;
}
.player-row.drag-target::before {
  content: '';
  position: absolute;
  top: -5px;
  left: 0;
  right: 0;
  height: 3px;
  background: #ff9f43;
  border-radius: 2px;
}
.player-label {
  width: 28px;
  font-weight: 700;
  color: #ff9f43;
  font-size: 1rem;
  text-align: center;
  flex-shrink: 0;
}
.player-input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #16213e;
  color: #fff;
  font-size: 1rem;
}
.player-input:focus {
  outline: none;
  border-color: #ff9f43;
}
.table-wrap {
  overflow-x: auto;
  margin-bottom: 16px;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  min-width: 500px;
}
th {
  background: #1a1a2e;
  color: #ff9f43;
  padding: 8px 4px;
  position: sticky;
  top: 0;
  font-size: 0.9rem;
  font-weight: 700;
  border-bottom: 2px solid #ff9f43;
}
td {
  padding: 8px 4px;
  text-align: center;
  border-bottom: 1px solid #222;
  font-weight: 600;
  transition: background 0.2s;
  font-size: 0.8rem;
}
td.court {
  background: #1b5e20;
  color: #c8e6c9;
}
td.bench {
  background: #4a1a1a;
  color: #f0f0f0;
  font-style: italic;
}
td.period-info {
  background: #16213e;
  color: #ccc;
  text-align: left;
  padding-left: 8px;
  white-space: nowrap;
  font-weight: 400;
  font-size: 0.8rem;
}
.summary-grid {
  display: grid;
  gap: 6px;
  max-width: 600px;
  margin: 0 auto;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: 6px;
  background: #16213e;
}
.summary-name { font-weight: 600; }
.summary-mins { color: #a5d6a7; font-weight: 700; }
.summary-bar-wrap {
  flex: 1;
  margin: 0 12px;
  height: 6px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
}
.summary-bar {
  height: 100%;
  background: #4caf50;
  border-radius: 3px;
  transition: width 0.3s;
}
.total-check {
  text-align: center;
  margin-top: 10px;
  font-size: 0.85rem;
  color: #888;
}
.history-grid {
  display: grid;
  gap: 8px;
  max-width: 600px;
  margin: 0 auto;
}
.history-entry {
  background: #16213e;
  border-radius: 6px;
  padding: 10px 12px;
}
.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.history-date {
  font-weight: 700;
  color: #ff9f43;
  font-size: 0.95rem;
}
.history-players-label {
  font-size: 0.8rem;
  color: #888;
  margin-left: 8px;
}
.history-delete {
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid #e74c3c;
  background: transparent;
  color: #e74c3c;
  font-size: 0.8rem;
  cursor: pointer;
}
.history-delete:hover {
  background: #e74c3c;
  color: #fff;
}
.history-roster {
  font-size: 0.85rem;
  color: #ccc;
  line-height: 1.6;
}
.history-empty {
  text-align: center;
  color: #666;
  font-size: 0.9rem;
  padding: 20px;
}
</style>
</head>
<body>

<h1>Basketball Subs</h1>

<div class="collapsible" id="settings-section">
  <div class="collapsible-header" onclick="toggleSection('settings-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>Settings</h2>
  </div>
  <div class="collapsible-body">
    <div class="tabs" id="tabs"></div>
    <div class="config-row">
      <label for="qlen">Quarter length:</label>
      <select id="qlen">
        <option value="8">8 min</option>
        <option value="10" selected>10 min</option>
        <option value="12">12 min</option>
      </select>
    </div>
    <div class="config-row">
      <button class="rotate-btn" onclick="rotatePlayers()">Rotate</button>
      <button class="start-btn" onclick="archiveRoster()">Start</button>
    </div>
  </div>
</div>

<div class="collapsible" id="players-section">
  <div class="collapsible-header" onclick="toggleSection('players-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>Players</h2>
  </div>
  <div class="collapsible-body" id="players"></div>
</div>
<div class="table-wrap"><table id="rotation"><thead></thead><tbody></tbody></table></div>
<div class="collapsible" id="summary-section">
  <div class="collapsible-header" onclick="toggleSection('summary-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>Playing Time</h2>
  </div>
  <div class="collapsible-body" id="summary"></div>
</div>
<div class="collapsible collapsed" id="history-section">
  <div class="collapsible-header" onclick="toggleSection('history-section')">
    <span class="collapsible-arrow">&#9660;</span>
    <h2>History</h2>
  </div>
  <div class="collapsible-body" id="history"></div>
</div>

<script>
const LETTERS = ['A','B','C','D','E','F','G','H'];

const BENCH_SCHEDULES = {
  8: [
    [5,6,7], [2,3,4], [0,1,7], [4,5,6], [1,2,3], [0,6,7], [3,4,5], [0,1,2], [5,6,7]
  ],
  7: [
    [5,6], [3,4], [1,2], [0,6], [4,5], [2,3], [0,1], [5,6], [3,4]
  ],
  6: [
    [5], [4], [3], [2], [1], [0], [5], [4], [3]
  ]
};

function getStore() {
  try { return JSON.parse(window.name || '{}'); } catch(e) { return {}; }
}
function saveData(key, val) {
  const store = getStore();
  store[key] = val;
  window.name = JSON.stringify(store);
}
function loadData(key) {
  return getStore()[key] || null;
}
function toggleSection(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

let activeTab = parseInt(loadData('bball_activeTab')) || 8;
let names = JSON.parse(loadData('bball_names') || '{}');
let rosterHistory = JSON.parse(loadData('bball_history') || '[]');

function init() {
  const tabsEl = document.getElementById('tabs');
  [6,7,8].forEach(n => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (n === activeTab ? ' active' : '');
    btn.textContent = n + ' Players';
    btn.onclick = () => switchTab(n);
    tabsEl.appendChild(btn);
  });
  const savedQlen = loadData('bball_qlen');
  if (savedQlen) document.getElementById('qlen').value = savedQlen;
  buildAll();
  document.getElementById('qlen').addEventListener('change', () => {
    saveData('bball_qlen', document.getElementById('qlen').value);
    buildAll();
  });
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function rotatePlayers() {
  const n = activeTab;
  const letters = LETTERS.slice(0, n);
  const shift = 3;
  const oldNames = letters.map(l => names[l] || ('Player ' + l));
  const newNames = new Array(n);
  for (let i = 0; i < n; i++) {
    const dest = i < n - shift ? i + shift : n - 1 - i;
    newNames[dest] = oldNames[i];
  }
  letters.forEach((l, i) => { names[l] = newNames[i]; });
  saveData('bball_names', JSON.stringify(names));
  buildAll();
}

function archiveRoster() {
  const letters = LETTERS.slice(0, activeTab);
  const roster = {};
  letters.forEach(l => { roster[l] = names[l] || ('Player ' + l); });

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-AU', {
    day: '2-digit', month: 'short', year: 'numeric'
  });
  const timeStr = now.toLocaleTimeString('en-AU', {
    hour: '2-digit', minute: '2-digit', hour12: true
  });

  rosterHistory.unshift({
    date: dateStr + ' ' + timeStr,
    roster: roster,
    playerCount: activeTab,
    quarterLength: parseInt(document.getElementById('qlen').value)
  });
  saveData('bball_history', JSON.stringify(rosterHistory));
  buildHistory();
  document.getElementById('history-section').classList.remove('collapsed');
}

function deleteHistoryEntry(idx) {
  rosterHistory.splice(idx, 1);
  saveData('bball_history', JSON.stringify(rosterHistory));
  buildHistory();
}

function switchTab(n) {
  activeTab = n;
  saveData('bball_activeTab', n);
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', [6,7,8][i] === n);
  });
  buildAll();
}

function buildAll() {
  buildInputs();
  buildTable();
  buildSummary();
  buildHistory();
}

function buildInputs() {
  const el = document.getElementById('players');
  const letters = LETTERS.slice(0, activeTab);
  el.innerHTML = '<div class="players-grid">' + letters.map(l => {
    const saved = names[l] || ('Player ' + l);
    return `<div class="player-row" data-letter="${l}"
      ontouchstart="onDragStart(event,'${l}')"
      onmousedown="onDragStart(event,'${l}')">
      <span class="player-label">${l}</span>
      <input class="player-input" data-letter="${l}" value="${saved}" oninput="onName(this)">
    </div>`;
  }).join('') + '</div>';
}

function onName(input) {
  names[input.dataset.letter] = input.value;
  saveData('bball_names', JSON.stringify(names));
  buildTable();
  buildSummary();
}

function getName(idx) {
  const l = LETTERS[idx];
  return names[l] || ('Player ' + l);
}

/* ---- Drag and Drop ---- */
let drag = null;

function onDragStart(e, letter) {
  const isTouch = e.type === 'touchstart';
  const y = isTouch ? e.touches[0].clientY : e.clientY;
  drag = {
    letter: letter,
    startY: y,
    active: false,
    targetLetter: null,
    holdTimer: setTimeout(() => {
      if (!drag || drag.letter !== letter) return;
      drag.active = true;
      const row = document.querySelector('.player-row[data-letter="' + letter + '"]');
      if (row) row.classList.add('dragging');
      document.body.classList.add('no-scroll');
      if (document.activeElement) document.activeElement.blur();
    }, 400)
  };
}

function onDragMove(e) {
  if (!drag) return;
  const isTouch = e.type === 'touchmove';
  const y = isTouch ? e.touches[0].clientY : e.clientY;
  if (!drag.active) {
    if (Math.abs(y - drag.startY) > 8) {
      clearTimeout(drag.holdTimer);
      drag = null;
    }
    return;
  }
  e.preventDefault();
  document.querySelectorAll('.player-row').forEach(r => r.classList.remove('drag-target'));
  drag.targetLetter = null;
  const rows = document.querySelectorAll('.player-row');
  for (const row of rows) {
    const rl = row.dataset.letter;
    if (rl === drag.letter) continue;
    const rect = row.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) {
      row.classList.add('drag-target');
      drag.targetLetter = rl;
      break;
    }
  }
}

function onDragEnd() {
  if (!drag) return;
  clearTimeout(drag.holdTimer);
  const wasActive = drag.active;
  const fromLetter = drag.letter;
  const toLetter = drag.targetLetter;
  document.querySelectorAll('.player-row').forEach(r => {
    r.classList.remove('dragging', 'drag-target');
  });
  document.body.classList.remove('no-scroll');
  drag = null;
  if (wasActive && toLetter && fromLetter !== toLetter) {
    const letters = LETTERS.slice(0, activeTab);
    const currentNames = letters.map(l => names[l] || ('Player ' + l));
    const fromIdx = letters.indexOf(fromLetter);
    const toIdx = letters.indexOf(toLetter);
    const [moved] = currentNames.splice(fromIdx, 1);
    currentNames.splice(toIdx, 0, moved);
    letters.forEach((l, i) => { names[l] = currentNames[i]; });
    saveData('bball_names', JSON.stringify(names));
    buildAll();
  }
}
/* ---- End Drag and Drop ---- */

function getPeriods() {
  const q = parseInt(document.getElementById('qlen').value);
  const half = q / 2;
  const third = q / 3;
  return [
    { quarter: 'Q1', from: q, to: half, mins: half },
    { quarter: 'Q1', from: half, to: 0, mins: half },
    { quarter: 'Q2', from: q, to: half, mins: half },
    { quarter: 'Q2', from: half, to: 0, mins: half },
    { quarter: 'Q3', from: q, to: half, mins: half },
    { quarter: 'Q3', from: half, to: 0, mins: half },
    { quarter: 'Q4', from: q, to: q - third, mins: third },
    { quarter: 'Q4', from: q - third, to: q - third * 2, mins: third },
    { quarter: 'Q4', from: q - third * 2, to: 0, mins: third },
  ];
}

function fmtTime(mins) {
  const m = Math.floor(mins);
  const s = Math.round((mins - m) * 60);
  return m + ':' + String(s).padStart(2, '0');
}

function fmtMinsSec(totalMins) {
  const m = Math.floor(totalMins);
  const s = Math.round((totalMins - m) * 60);
  return m + ':' + String(s).padStart(2, '0');
}

function buildTable() {
  const n = activeTab;
  const bench = BENCH_SCHEDULES[n];
  const periods = getPeriods();
  const letters = LETTERS.slice(0, n);

  let headHtml = '<tr><th>Qtr</th><th>Clock</th>';
  letters.forEach(l => { headHtml += '<th>' + l + '</th>'; });
  headHtml += '</tr>';

  let bodyHtml = '';
  periods.forEach((p, pi) => {
    const benchSet = new Set(bench[pi]);
    bodyHtml += '<tr>';
    bodyHtml += '<td class="period-info">' + p.quarter + '</td>';
    bodyHtml += '<td class="period-info">' + fmtTime(p.from) + ' - ' + fmtTime(p.to) + '</td>';
    for (let i = 0; i < n; i++) {
      const onBench = benchSet.has(i);
      bodyHtml += '<td class="' + (onBench ? 'bench' : 'court') + '">' + getName(i) + '</td>';
    }
    bodyHtml += '</tr>';
  });

  const table = document.getElementById('rotation');
  table.querySelector('thead').innerHTML = headHtml;
  table.querySelector('tbody').innerHTML = bodyHtml;
}

function getPeriodsForQ(q) {
  const half = q / 2;
  const third = q / 3;
  return [
    { mins: half }, { mins: half }, { mins: half }, { mins: half },
    { mins: half }, { mins: half }, { mins: third }, { mins: third }, { mins: third }
  ];
}

function calcPlayerMins(n, q) {
  const bench = BENCH_SCHEDULES[n];
  const periods = getPeriodsForQ(q);
  const mins = [];
  for (let i = 0; i < n; i++) {
    let total = 0;
    periods.forEach((p, pi) => { if (!bench[pi].includes(i)) total += p.mins; });
    mins.push(total);
  }
  return mins;
}

let summaryMode = 'game';

function toggleSummaryMode() {
  summaryMode = summaryMode === 'game' ? 'accumulated' : 'game';
  buildSummary();
}

function buildSummary() {
  const el = document.getElementById('summary');
  const hasHistory = rosterHistory.length > 0;

  let html = '';
  if (hasHistory) {
    html += '<div style="text-align:center;margin-bottom:8px;">' +
      '<button class="rotate-btn" onclick="toggleSummaryMode()" style="font-size:0.85rem;padding:6px 14px;">' +
      (summaryMode === 'game' ? 'Show Accumulated' : 'Show This Game') +
      '</button></div>';
  }

  if (summaryMode === 'game' || !hasHistory) {
    html += buildGameSummary();
  } else {
    html += buildAccumulated();
  }

  el.innerHTML = html;
}

function buildGameSummary() {
  const n = activeTab;
  const q = parseInt(document.getElementById('qlen').value);
  const playerMins = calcPlayerMins(n, q);
  const totalGameMins = q * 4 * 5;
  const bench = BENCH_SCHEDULES[n];
  const periods = getPeriods();
  let maxMins = Math.max(...playerMins);
  let checkSum = playerMins.reduce((a, b) => a + b, 0);

  let html = '<div class="summary-grid">';
  for (let i = 0; i < n; i++) {
    const pct = maxMins > 0 ? (playerMins[i] / maxMins * 100) : 0;
    const periodsPlayed = periods.length - bench.filter(b => b.includes(i)).length;
    html += '<div class="summary-row">' +
      '<span class="summary-name">' + getName(i) + '</span>' +
      '<div class="summary-bar-wrap"><div class="summary-bar" style="width:' + pct + '%"></div></div>' +
      '<span class="summary-mins">' + fmtMinsSec(playerMins[i]) + ' (' + periodsPlayed + ' periods)</span>' +
      '</div>';
  }
  html += '</div>';
  html += '<div class="total-check">Total player-minutes: ' + fmtMinsSec(checkSum) + ' / ' + fmtMinsSec(totalGameMins) + ' game-minutes</div>';
  return html;
}

function buildAccumulated() {
  if (rosterHistory.length === 0) return '';

  const totals = {};
  rosterHistory.forEach(entry => {
    const n = entry.playerCount;
    const q = entry.quarterLength || 10;
    const mins = calcPlayerMins(n, q);
    const letters = LETTERS.slice(0, n);
    letters.forEach((l, i) => {
      const name = entry.roster[l] || ('Player ' + l);
      totals[name] = (totals[name] || 0) + mins[i];
    });
  });

  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const maxMins = sorted[0][1];

  let html = '<h3 style="color:#ff9f43;font-size:0.95rem;text-align:center;margin:14px 0 6px;">Accumulated (' + rosterHistory.length + ' game' + (rosterHistory.length > 1 ? 's' : '') + ')</h3>';
  html += '<div class="summary-grid">';
  sorted.forEach(([name, mins]) => {
    const pct = maxMins > 0 ? (mins / maxMins * 100) : 0;
    html += '<div class="summary-row">' +
      '<span class="summary-name">' + name + '</span>' +
      '<div class="summary-bar-wrap"><div class="summary-bar" style="width:' + pct + '%"></div></div>' +
      '<span class="summary-mins">' + fmtMinsSec(mins) + '</span>' +
      '</div>';
  });
  html += '</div>';
  return html;
}

function buildHistory() {
  const el = document.getElementById('history');
  if (rosterHistory.length === 0) {
    el.innerHTML = '<div class="history-empty">No history yet. Press Start to archive the current roster.</div>';
    return;
  }
  let html = '<div class="history-grid">';
  rosterHistory.forEach((entry, idx) => {
    const letters = LETTERS.slice(0, entry.playerCount);
    const rosterLines = letters.map(l => '<b>' + l + ':</b> ' + (entry.roster[l] || 'Player ' + l)).join(' &nbsp; ');
    html += '<div class="history-entry">' +
      '<div class="history-header">' +
        '<span class="history-date">' + entry.date + '<span class="history-players-label">' + entry.playerCount + ' players</span></span>' +
        '<button class="history-delete" onclick="deleteHistoryEntry(' + idx + ')">Delete</button>' +
      '</div>' +
      '<div class="history-roster">' + rosterLines + '</div>' +
    '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

init();
</script>

</body>
</html>
